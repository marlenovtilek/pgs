{% extends "layout.html" %}

{% block header %}
    <div class="d-flex justify-content-between align-items-center">
        <h1>LED-симулятор</h1>
        <ol class="breadcrumb">
            <li class="breadcrumb-item">
                <a href="{{ url_for(__name__ ~ ':index') }}">Админка</a>
            </li>
            <li class="breadcrumb-item active">LED-симулятор</li>
        </ol>
    </div>
{% endblock %}

{% block content %}
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">PGS LED-симулятор</h3>
            </div>
            <div class="card-body p-0">
                <iframe
                    title="PGS LED-симулятор"
                    srcdoc="{{ led_simulator_html | forceescape }}"
                    style="display:block;width:100%;height:calc(100vh - 210px);min-height:760px;border:0;background:#101114;"
                ></iframe>
            </div>
        </div>
    </div>
{% endblock %}

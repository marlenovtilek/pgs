services:
  pgs-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pgs-migrate
    working_dir: /app
    command: alembic upgrade head
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    env_file:
      - .env
    depends_on:
      pgs-db:
        condition: service_healthy
    networks:
      - default

  pgs-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pgs-api
    working_dir: /app
    ports:
      - "8010:8000"
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    env_file:
      - .env
    depends_on:
      pgs-db:
        condition: service_healthy
      pgs-migrate:
        condition: service_completed_successfully
      pgs-bootstrap:
        condition: service_completed_successfully
    networks:
      - default
      - smartparking_db_network
    restart: unless-stopped

  pgs-mqtt-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pgs-mqtt-consumer
    working_dir: /app
    command: python -m app.mqtt.consume_spot_events --auto-create
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    env_file:
      - .env
    depends_on:
      pgs-db:
        condition: service_healthy
      pgs-migrate:
        condition: service_completed_successfully
      pgs-bootstrap:
        condition: service_completed_successfully
    networks:
      - default
      - smartparking_db_network
    restart: unless-stopped

  pgs-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pgs-bootstrap
    working_dir: /app
    command: python -m app.simulation.bootstrap_parking_config
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    env_file:
      - .env
    depends_on:
      pgs-db:
        condition: service_healthy
      pgs-migrate:
        condition: service_completed_successfully
    networks:
      - default

  pgs-db:
    image: postgres:16
    container_name: pgs-db
    environment:
      POSTGRES_DB: pgs
      POSTGRES_USER: pgs
      POSTGRES_PASSWORD: pgs
    ports:
      - "5435:5432"
    volumes:
      - pgs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgs -d pgs"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

networks:
  smartparking_db_network:
    external: true

volumes:
  pgs_pgdata: {}
